server:
  application-display-name: ${spring.application.name}
  port: 8080
  servlet:
    contextPath: /

spring:
  application:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
  main:
    allow-bean-definition-overriding: true

  profiles:
    active: dev

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME:your_username}
    password: ${MAIL_PASSWORD:your_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Configurações do Springdoc/Swagger
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.scheduly.api: DEBUG

api:
  host: https://viacep.com.br/ws

# Configurações JWT
app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d}
    access-expiration-ms: 900000      # 15 minutos
    refresh-expiration-ms: 2592000000 # 30 dias

