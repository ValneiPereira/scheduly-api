openapi: 3.0.3
info:
  title: Manicure Scheduler API
  description: API REST para o MVP do SaaS de agendamento de serviços de manicure (MVP, single-tenant).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.seusistema.com
    description: Produção

tags:
  - name: auth
    description: Autenticação (JWT)
  - name: clients
    description: Operações de clientes
  - name: professionals
    description: Operações de profissionais
  - name: services
    description: Operações de serviços
  - name: bookings
    description: Agendamentos
  - name: notifications
    description: Notificações
  - name: utils
    description: Utilitários (CEP, health)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: "Conflito (ex.: horário indisponível)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoContent:
      description: Sem conteúdo

  schemas:

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
        error:
          type: string
        timestamp:
          type: string
          format: date-time
          example: "09-12-2025"

    # AUTH
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "admin@studio.com"
        password:
          type: string
          example: "senha123"
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          example: 3600
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string

    # ADDRESS
    AddressRequest:
      type: object
      required:
        - street
        - neighborhood
        - city
        - state
        - zipCode
      properties:
        street:
          type: string
          minLength: 1
          x-field-extra-annotation: >
            @jakarta.validation.constraints.NotBlank(message = "Rua é obrigatória")

        number:
          type: string

        complement:
          type: string

        neighborhood:
          type: string
          minLength: 1
          x-field-extra-annotation: >
            @jakarta.validation.constraints.NotBlank(message = "Bairro é obrigatório")

        city:
          type: string
          minLength: 1
          x-field-extra-annotation: >
            @jakarta.validation.constraints.NotBlank(message = "Cidade é obrigatória")

        state:
          type: string
          pattern: "^[A-Z]{2}$"
          x-field-extra-annotation: >
            @jakarta.validation.constraints.Pattern(
              regexp = "^[A-Z]{2}$",
              message = "Estado deve conter 2 letras (ex: SP)"
            )

        zipCode:
          type: string
          pattern: "\\d{5}-\\d{3}"
          x-field-extra-annotation: >
            @jakarta.validation.constraints.Pattern(
              regexp = "\\d{5}-\\d{3}",
              message = "CEP inválido (ex: 01310-100)"
            )

    AddressResponse:
      type: object
      properties:
        street: { type: string }
        number: { type: string }
        complement: { type: string }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }


    # CLIENTS
    ClientResponse:
      type: object
      required:
        - id
        - name
        - email
        - cpf
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        phone:
          type: string
        address:
          $ref: '#/components/schemas/AddressResponse'
        createdAt:
          type: string
          format: date-time
          example: "09-12-2025"
        updatedAt:
          type: string
          format: date-time
          example: "09-12-2025"
    ClientRequest:
      type: object
      required:
        - name
        - email
        - cpf
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        cpf:
          type: string
        phone:
          type: string
          pattern: "\\d{10,11}"
        address:
          $ref: '#/components/schemas/AddressRequest'

    # PROFESSIONALS
    ProfessionalResponse:
      type: object
      required: [ id, name ]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Joana Pereira" }
        bio: { type: string, example: "Especialista em alongamento e nail art" }
        phone: { type: string, example: "+55 51 98888-1111" }
        email: { type: string, format: email, example: "joana.pereira@email.com" }
        address: { $ref: '#/components/schemas/AddressResponse' }
        specialtyIds: { type: array, items: { type: integer, format: int64 }, example: [ 1, 3, 5 ] }
        rating: { type: number, format: decimal, example: 4.8 }
        totalReviews: { type: integer, example: 152 }
        workStartTime: { type: string, format: time, example: "09:00" }
        workEndTime: { type: string, format: time, example: "19:00" }
        workingDays: { type: array, items: { type: string }, example: [ "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY" ] }
        active: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: "2025-12-15T15:55:16" }
        updatedAt: { type: string, format: date-time, example: "2025-12-15T15:55:16" }
    ProfessionalRequest:
      type: object
      required: [name, email, cpf, phone, workStartTime, workEndTime, workingDays, active]
      properties:
        name: { type: string }
        email: { type: string, format: email}
        cpf: { type: string }
        phone: { type: string }
        address:
          $ref: '#/components/schemas/AddressRequest'
        bio: { type: string }
        specialtyIds:
          type: array
          items: { type: integer, format: int64 }
        workStartTime: { type: string, format: time, example: "09:00" }
        workEndTime: { type: string, format: time, example: "19:00" }
        workingDays:
          type: array
          items: { type: string }
          example: [ "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY" ]
        active: { type: boolean }
    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
    ReviewResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        professionalId: { type: integer, format: int64 }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    # SERVICES
    ServiceResponse:
      type: object
      required: [id, name, durationMinutes, priceCents, category, subcategory]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "Manicure Básica" }
        description: { type: string }
        category:
          type: string
          enum: [BELEZA, SAUDE, SERVICOS, EDUCACAO, OUTROS]
        subcategory:
          type: string
          enum: [CABELEIREIRO, BARBEIRO, ESTETICISTA, DESIGNER_SOBRANCELHA, MANICURE, PSICOLOGO, FISIOTERAPEUTA, NUTRICIONISTA, PERSONAL_TRAINER, ELETRICISTA, ENCANADOR, TECNICO_INFORMATICA, MONTADOR_MOVEIS, AULA_PARTICULAR, PROFESSOR_IDIOMAS, REFORCO_ESCOLAR, MENTOR, OUTROS]
        durationMinutes: { type: integer, example: 45 }
        priceCents: { type: integer, example: 3500 }
        createdAt:
          type: string
          format: date-time
    ServiceRequest:
      type: object
      required: [name, durationMinutes, priceCents, category, subcategory]
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string, example: "BELEZA" }
        subcategory: { type: string, example: "MANICURE" }
        durationMinutes: { type: integer }
        priceCents: { type: integer }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        subcategory: { type: string }
        durationMinutes: { type: integer }
        priceCents: { type: integer }

    # BOOKINGS
    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
    Booking:
      type: object
      required: [id, clientId, professionalId, serviceId, startAt, endAt, status]
      properties:
        id: { type: integer, format: int64 }
        clientId: { type: integer, format: int64 }
        professionalId: { type: integer, format: int64 }
        serviceId: { type: integer, format: int64 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/BookingStatus'
        notes: { type: string }
        createdAt: { type: string, format: date-time }
    BookingCreate:
      type: object
      required: [clientId, professionalId, serviceId, startAt]
      properties:
        clientId: { type: integer, format: int64 }
        professionalId: { type: integer, format: int64 }
        serviceId: { type: integer, format: int64 }
        startAt: { type: string, format: date-time }
        notes: { type: string }
    BookingUpdate:
      type: object
      properties:
        startAt: { type: string, format: date-time }
        notes: { type: string }
        status:
          $ref: '#/components/schemas/BookingStatus'

    # NOTIFICATIONS
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bookingId: { type: integer, format: int64 }
        channel: { type: string, example: "WHATSAPP" }
        message: { type: string }
        sentAt: { type: string, format: date-time }
    NotificationCreate:
      type: object
      required: [bookingId, channel]
      properties:
        bookingId: { type: integer, format: int64 }
        channel:
          type: string
          enum: [WHATSAPP, EMAIL, PUSH, SMS]
        message: { type: string }

    # CEP
    CepResponse:
      type: object
      properties:
        cep: { type: string }
        logradouro: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        localidade: { type: string }
        uf: { type: string }
        ddd: { type: string }

