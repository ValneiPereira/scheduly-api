    '/professionals/{professionalId}/availability':
        get:
            tags:
                - professionals
            summary: Consultar disponibilidade de horarios de um profissional
            description: |
                Retorna lista de slots de horarios disponiveis para agendamento em uma data especifica.
                Considera:
                - Horário de trabalho do profissional (workStartTime, workEndTime)
                - Dias de trabalho (workingDays)
                - Agendamentos já existentes (confirmados ou pendentes)
                - Duração do serviço (durationMinutes)
            operationId: getProfessionalAvailability
            parameters:
                - name: professionalId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: ID do profissional
                - name: date
                  in: query
                  required: true
                  schema:
                      type: string
                      format: date
                      example: '2024-04-25'
                  description: Data para consulta (formato YYYY-MM-DD)
                - name: durationMinutes
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 15
                      maximum: 480
                      default: 30
                      example: 30
                  description: 'Duracao do servico em minutos (padrao: 30)'
            responses:
                '200':
                    description: Lista de horarios disponiveis
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AvailabilityResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    $ref: '#/components/responses/NotFound'
    '/professionals/{professionalId}/services':
        get:
            tags:
                - professionals
            summary: Listar serviços do profissional
            description: Retorna todos os serviços cadastrados por um profissional
            operationId: listProfessionalServices
            parameters:
                - name: professionalId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: ID do profissional
            responses:
                '200':
                    description: Lista de serviços do profissional
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ProfessionalServiceResponse'
                '404':
                    $ref: '#/components/responses/NotFound'
                    description: Profissional não encontrado
        post:
            tags:
                - professionals
            summary: Adicionar serviço ao profissional
            description: |
                Cadastra um novo serviço para o profissional.
                O profissional pode definir preço e duração personalizados para cada serviço.
            operationId: addProfessionalService
            parameters:
                - name: professionalId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: ID do profissional
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfessionalServiceRequest'
            responses:
                '201':
                    description: Serviço adicionado com sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfessionalServiceResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                    description: Dados inválidos ou serviço já cadastrado
                '404':
                    $ref: '#/components/responses/NotFound'
                    description: Profissional ou departamento não encontrado
    '/professionals/{professionalId}/services/{departmentId}':
        put:
            tags:
                - professionals
            summary: Atualizar serviço do profissional
            description: |
                Atualiza o preço e/ou duração de um serviço já cadastrado pelo profissional.
                Permite atualizar apenas o preço, apenas a duração, ou ambos.
            operationId: updateProfessionalService
            parameters:
                - name: professionalId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: ID do profissional
                - name: departmentId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: ID do serviço (departamento) a ser atualizado
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfessionalServiceUpdate'
            responses:
                '200':
                    description: Serviço atualizado com sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfessionalServiceResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                    description: Dados inválidos
                '404':
                    $ref: '#/components/responses/NotFound'
                    description: Profissional ou serviço não encontrado
        delete:
            tags:
                - professionals
            summary: Remover serviço do profissional
            description: Remove um serviço da lista de serviços oferecidos pelo profissional
            operationId: removeProfessionalService
            parameters:
                - name: professionalId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: ID do profissional
                - name: departmentId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: ID do serviço (departamento) a ser removido
            responses:
                '204':
                    $ref: '#/components/responses/NoContent'
                    description: Serviço removido com sucesso
                '404':
                    $ref: '#/components/responses/NotFound'
                    description: Profissional ou serviço não encontrado

