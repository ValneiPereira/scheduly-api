    '/professionals/{professionalId}/reviews':
        post:
            tags:
                - professionals
            summary: Avaliar profissional
            operationId: createReview
            parameters:
                - name: professionalId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReviewRequest'
            responses:
                '201':
                    description: Avaliação criada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewResponse'
                '400':
