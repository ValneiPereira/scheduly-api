  /clients:
    get:
      tags: [clients]
      summary: Listar clientes
      operationId: listClients
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'
    post:
      tags: [clients]
      summary: Criar cliente
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '201':
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /clients/{clientId}:
    get:
      tags: [clients]
      summary: Buscar cliente por ID
      operationId: getClient
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [clients]
      summary: Atualizar cliente
      operationId: updateClient
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
    delete:
      tags: [clients]
      summary: Remover cliente (soft delete recomendado)
      operationId: deleteClient
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /clients/search:
    get:
      tags: [clients]
      summary: Buscar clientes por Nome (Partial Match)
      description: "Pesquisa por nome parcial."
      operationId: getClientByName
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Nome ou parte do nome para pesquisa
      responses:
        '200':
          description: Lista de clientes encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'


  /professionals:
    get:
      tags: [professionals]
      summary: Listar profissionais
      operationId: listProfessionals
      parameters:
        - name: serviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: filtrar por serviceId
      responses:
        '200':
          description: Lista de profissionais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionalResponse'
    post:
      tags: [professionals]
      summary: Criar profissional
      operationId: createProfessional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionalRequest'
      responses:
        '201':
          description: Profissional criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /professionals/{professionalId}:
    get:
      tags: [professionals]
      summary: Buscar profissional por ID
      operationId: getProfessional
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Profissional encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [professionals]
      summary: Atualizar profissional
      operationId: updateProfessional
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionalRequest'
      responses:
        '200':
          description: Profissional atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalResponse'
    delete:
      tags: [professionals]
      summary: Remover profissional
      operationId: deleteProfessional
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /professionals/{professionalId}/reviews:
    post:
      tags: [professionals]
      summary: Avaliar profissional
      operationId: createReview
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Avaliação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /services:
    get:
      tags: [services]
      summary: Listar serviços
      operationId: listServices
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: 'Filtrar por categoria (ex: "BELEZA", "SAUDE")'
      responses:
        '200':
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceResponse'
    post:
      tags: [services]
      summary: Criar serviço
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
      responses:
        '201':
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /services/{serviceId}:
    get:
      tags: [services]
      summary: Buscar serviço por ID
      operationId: getService
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [services]
      summary: Atualizar serviço
      operationId: updateService
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [services]
      summary: Remover serviço
      operationId: deleteService
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContent'

