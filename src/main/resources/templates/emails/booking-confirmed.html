<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendamento Confirmado</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: 20px auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .header { background: #6200ee; color: white; padding: 10px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; }
        .footer { text-align: center; font-size: 0.8em; color: #777; margin-top: 20px; }
        .button { display: inline-block; padding: 10px 20px; background: #6200ee; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Scheduly</h1>
        </div>
        <div class="content">
            <h2>Olá, <span th:text="${clientName}">Cliente</span>!</h2>
            <p>Seu agendamento foi realizado com sucesso.</p>
            <p><strong>Detalhes:</strong></p>
            <ul>
                <li><strong>Serviço:</strong> <span th:text="${serviceName}">Manicure</span></li>
                <li><strong>Data:</strong> <span th:text="${date}">01/01/2024</span></li>
                <li><strong>Horário:</strong> <span th:text="${time}">14:00</span></li>
                <li><strong>Profissional:</strong> <span th:text="${professionalName}">Valnei</span></li>
            </ul>
            <p>Aguardamos você!</p>
            <br>
            <a href="#" class="button">Ver Meus Agendamentos</a>
        </div>
        <div class="footer">
            <p>Scheduly - Sua agenda inteligente</p>
        </div>
    </div>
</body>
</html>
